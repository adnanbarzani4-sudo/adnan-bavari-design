<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b12"><title>Logo | Adnan Bavari Design</title><style>
:root{--bg:#071b12;--panel:#0d2b1d;--gold:#d8b75f;--gold2:#f1dda0;--txt:#f7f3e8;--muted:#bac8bd;--line:#315541}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#163c29,var(--bg) 58%);color:var(--txt);font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:24px;font-weight:900;color:var(--gold2)}a,button{color:var(--gold2)}.btn{display:inline-block;background:#102f20;border:1px solid var(--gold);padding:10px 15px;border-radius:11px;text-decoration:none;font-weight:750}.panel{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{background:#f4f0e6;min-height:300px;display:grid;place-items:center;padding:20px}.photo img{max-width:100%;max-height:65vh;object-fit:contain}.body{padding:22px}.name{font-size:28px;color:var(--gold2);margin:0 0 12px}.desc{color:var(--muted);line-height:1.8}.price{font-size:24px;color:var(--gold);font-weight:900;margin:18px 0}.wa{display:block;text-align:center;text-decoration:none;background:var(--gold);color:#102316;font-weight:900;padding:14px;border-radius:12px}.error{padding:50px;text-align:center;color:var(--muted)}@media(max-width:550px){.photo{min-height:220px}.name{font-size:22px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">ADNAN BAVARI DESIGN</div><a class="btn" href="/">← <span id="back">گەڕانەوە بۆ گەلەری</span></a><button class="btn" onclick="setLang(lang==='ku'?'en':'ku')" id="language">English</button></div><section class="panel" id="content"><div class="error">چاوەڕێ بکە...</div></section></main><script>
const WA="9647506950563";let lang="ku",p;const t=(a,b)=>lang==="ku"?a:b;function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ku"?"rtl":"ltr";document.getElementById("back").textContent=t("گەڕانەوە بۆ گەلەری","Back to gallery");document.getElementById("language").textContent=t("English","کوردی");show();}
async function init(){try{let r=await fetch("/api/products");let all=await r.json();let id=new URLSearchParams(location.search).get("id");p=all.find(x=>String(x.id)===String(id));show()}catch(e){document.getElementById("content").innerHTML='<div class="error">هەڵەیەک ڕوویدا. دواتر هەوڵ بدەرەوە.</div>'}}
function show(){if(!p){document.getElementById("content").innerHTML='<div class="error">لۆگۆکە نەدۆزرایەوە. <a href="/">گەڕانەوە</a></div>';return}let n=lang==="ku"?p.name:p.nameEn||p.name,d=lang==="ku"?p.description:p.descriptionEn||p.description,price=p.currency==="USD"?"$"+p.price:p.price+" IQD",msg=encodeURIComponent(t("سڵاو، حەز دەکەم ئەم لۆگۆیە بکڕم یان زانیاری زیاتر وەربگرم: ","Hello, I am interested in this logo: ")+n+" (#"+p.id+")");document.getElementById("content").innerHTML=`<div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(n)}">`:`<div style="font-size:42px;color:#183b29;font-weight:900">AB · ${esc(p.id)}</div>`}</div><div class="body"><h1 class="name">${esc(n)}</h1><div class="desc">${esc(d||"")}</div><div class="price">${esc(price)}</div><a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">${t("پەیوەندی لە واتسئاپ","Contact on WhatsApp")}</a></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}init();
</script></body></html>
